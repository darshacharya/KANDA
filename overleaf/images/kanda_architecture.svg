<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" font-family="Helvetica,Arial,sans-serif">

  <rect width="560" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="280" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">KANDA - Three-Layer Safety Architecture</text>

  <!-- CLOUD tier -->
  <rect x="60" y="56" width="440" height="110" rx="10" fill="#fff0f0" stroke="#e05252" stroke-width="2"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">CLOUD  |  1.5 to 4 seconds  |  DELIBERATE</text>
  <line x1="60" y1="90" x2="500" y2="90" stroke="#e05252" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="175" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Groq Llama 3.3</text>
  <text x="175" y="134" text-anchor="middle" font-size="11" fill="#666">Language, Commands, Planning</text>
  <text x="385" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">NVIDIA NIM Vision</text>
  <text x="385" y="134" text-anchor="middle" font-size="11" fill="#666">Camera, Scene Understanding</text>
  <line x1="280" y1="91" x2="280" y2="165" stroke="#e05252" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrow: Cloud to Edge -->
  <line x1="280" y1="166" x2="280" y2="196" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="288" y="172" width="38" height="16" fill="#fff"/>
  <text x="307" y="184" text-anchor="middle" font-size="10" fill="#777">HTTPS</text>

  <!-- EDGE tier -->
  <rect x="60" y="198" width="440" height="110" rx="10" fill="#f0f4ff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5282">RASPBERRY PI 4  |  instant check  |  CRITIC</text>
  <line x1="60" y1="232" x2="500" y2="232" stroke="#4a6fa5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="148" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Validator</text>
  <text x="148" y="276" text-anchor="middle" font-size="11" fill="#666">Blocks bad commands</text>
  <text x="296" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">State Machine</text>
  <text x="296" y="276" text-anchor="middle" font-size="11" fill="#666">Coordinates everything</text>
  <text x="432" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Body-Context</text>
  <text x="432" y="276" text-anchor="middle" font-size="11" fill="#666">Sensors + scene + history</text>

  <!-- Arrow: Edge to Device -->
  <line x1="280" y1="308" x2="280" y2="338" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="288" y="314" width="36" height="16" fill="#fff"/>
  <text x="306" y="326" text-anchor="middle" font-size="10" fill="#777">Serial</text>

  <!-- Sensor feedback arrow (right side) -->
  <path d="M 498 400 C 535 400 535 253 498 253" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrsm)"/>
  <text x="548" y="330" text-anchor="middle" font-size="10" fill="#aaa" transform="rotate(90,548,330)">sensor data</text>

  <!-- DEVICE tier -->
  <rect x="60" y="340" width="440" height="108" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">ESP32  |  47ms REFLEX  |  INDEPENDENT</text>
  <line x1="60" y1="374" x2="500" y2="374" stroke="#38a169" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="175" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3 Distance Sensors</text>
  <text x="175" y="418" text-anchor="middle" font-size="11" fill="#666">Front, Left, Right at 10Hz</text>
  <text x="385" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Motor Driver + Emergency Stop</text>
  <text x="385" y="418" text-anchor="middle" font-size="11" fill="#666">Cuts power even if Pi is offline</text>

  <!-- Key stat -->
  <text x="280" y="474" text-anchor="middle" font-size="11" fill="#999">42% of raw AI outputs rejected by Validator -- 0% reach wheels unsafe</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#999"/>
    </marker>
    <marker id="arrsm" markerWidth="6" markerHeight="6" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#aaa"/>
    </marker>
  </defs>

</svg>
